name: research-integrity
on:
  push:
    branches: [main, 'p001-*/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 resolved 2026-10-10
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 resolved 2026-10-10
        with:
          python-version: '3.12'
      - name: Validate records and exact target
        run: python3 scripts/validate.py
      - name: Check internal and external semantics
        run: python3 -m unittest discover -s tests -v
      - name: Report checked commit
        run: python3 -c "import os; print('Validated commit:', os.environ['GITHUB_SHA'])"
